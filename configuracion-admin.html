<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Admin | SAMANDTECH</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* Estilos para que las secciones midan lo mismo */
        .admin-config-container {
            max-width: 1000px;
            margin: 0 auto;
            min-height: 550px; /* Altura mínima fija para evitar saltos */
        }
        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .avatar-edit-container:hover .avatar-overlay { opacity: 1 !important; }

        /* --- ESTILOS MODERNOS PARA INPUTS (Pega esto en tu CSS) --- */
        .input-field {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1e293b;
            transition: all 0.3s ease;
            box-sizing: border-box; /* Importante para padding */
            background: white;
        }
        .input-field:focus {
            outline: none;
            border-color: #6366f1; /* Color corporativo */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
        .input-field:hover {
            border-color: #cbd5e1;
        }
    </style>
</head>
<body class="dashboard-page">
    
    <aside class="sidebar">
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div class="page-info"><h2>Configuración del Sistema</h2></div>
            <div class="user-info" style="display: flex; align-items: center; gap: 10px;">
                <div class="avatar" id="top-bar-avatar" style="width: 35px; height: 35px; border-radius: 50%; overflow: hidden; cursor: pointer; border: 2px solid #e2e8f0;">
                    </div>
            </div>
        </header>

        <section class="content-area">
            <div class="admin-config-container">
                
                <div class="modal-tabs" style="display: flex; gap: 30px; border-bottom: 2px solid #e2e8f0; margin-bottom: 25px;">
                    <div class="tab-item active" id="btn-tab-profile" style="padding: 10px 5px; cursor: pointer; font-weight: 600; color: #6366f1; border-bottom: 2px solid #6366f1;">
                        <i class="fa-solid fa-user-shield"></i> Mi Perfil
                    </div>
                    <div class="tab-item" id="btn-tab-users" style="padding: 10px 5px; cursor: pointer; font-weight: 600; color: #64748b;">
                        <i class="fa-solid fa-users-gear"></i> Gestión de Usuarios
                    </div>
                </div>

                <div id="tab-profile" class="tab-content active">
                    <div class="grid-2" style="display: grid; grid-template-columns: 1fr 350px; gap: 25px;">
                        <div class="card shadow-sm" style="padding: 30px; background: white; border-radius: 15px;">
                            <form id="admin-profile-form">
                                <h4 style="margin-bottom: 20px;"><i class="fa-solid fa-id-card"></i> Datos Personales</h4>
                                <div class="form-group">
                                    <label>Nombre Completo</label>
                                    <input type="text" id="admin-name" class="input-field" required>
                                </div>
                                <div class="form-group" style="margin-top: 15px;">
                                    <label>Correo Electrónico (Acceso)</label>
                                    <input type="email" id="admin-email" class="input-field" required>
                                </div>
                                <hr style="margin: 25px 0; border: 0; border-top: 1px solid #f1f5f9;">
                                <h4 style="margin-bottom: 20px;"><i class="fa-solid fa-lock"></i> Seguridad</h4>
                                <div class="form-group">
                                    <label>Nueva Contraseña</label>
                                    <input type="password" id="admin-password" class="input-field" placeholder="Dejar en blanco para no cambiar">
                                </div>
                                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 25px;">Guardar Cambios de Perfil</button>
                            </form>
                        </div>
                        <div class="card shadow-sm" style="padding: 30px; background: white; border-radius: 15px; text-align: center;">
    
                            <div class="avatar-edit-container" id="admin-avatar-trigger" style="position: relative; width: 150px; height: 150px; margin: 0 auto 20px; cursor: pointer;">
                                
                                <img id="admin-img" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none; border: 3px solid #f1f5f9;">
                                
                                <div id="admin-init" style="width: 100%; height: 100%; border-radius: 50%; background: #6366f1; color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold;">
                                    --
                                </div>

                                <div class="avatar-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; opacity: 0; transition: 0.3s;">
                                    <i class="fa-solid fa-camera fa-2xl"></i>
                                </div>
                            </div>

                            <input type="file" id="admin-file-input" accept="image/*" style="display: none;">
                            
                            <h3 id="display-name-card" style="margin-bottom: 5px;">Cargando...</h3>
                            <p style="color: #64748b; font-size: 0.9rem;">Administrador Principal</p>
                        </div>
                    </div>
                </div>

                <div id="tab-users" class="tab-content">
                    <div class="card shadow-sm" style="padding: 25px; background: white; border-radius: 15px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h4 style="margin:0;"><i class="fa-solid fa-users-gear"></i> Accesos Registrados</h4>
                            <button id="btn-new-user" class="btn-primary-sm">+ Nuevo Usuario</button>
                        </div>
                        <div class="table-container">
                            <table class="main-table">
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Rol</th>
                                        <th style="text-align: center;">Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="users-table-body">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <div id="user-modal" class="modal-overlay" style="z-index: 2000;">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Usuario</h2>
                <button class="btn-close" id="close-modal">&times;</button>
            </div>
            <form id="user-form">
                <input type="hidden" id="edit-id">
                <div class="modal-body">
                    <div class="form-group"><label>Nombre Completo</label><input type="text" id="u-name" class="input-field" required></div>
                    <div class="form-row" style="display: flex; gap: 10px; margin-top: 10px;">
                        <div class="form-group" style="flex: 1;"><label>Rol</label>
                            <select id="u-role" class="input-field">
                                <option value="tech">Técnico</option>
                                <option value="admin">Admin</option>
                                <option value="client">Cliente</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1;"><label>Correo</label><input type="email" id="u-email" class="input-field" required></div>
                    </div>
                    <div id="u-company-group" class="form-group" style="margin-top: 10px; display: none;">
                        <label>Empresa Asociada</label>
                        <select id="u-company" class="input-field"></select>
                    </div>
                    <div class="form-group" style="margin-top: 10px;"><label>Contraseña</label><input type="password" id="u-pass" class="input-field"></div>
                </div>
                <div class="modal-footer" style="display: flex; justify-content: space-between; margin-top: 20px;">
                    <button type="button" id="btn-delete" class="btn-danger-outline">Eliminar</button>
                    
                    <div>
                        <button type="button" class="btn-secondary" id="btn-cancel">Cancelar</button>
                        <button type="submit" class="btn-primary">Guardar</button>
                    </div>
                </div>
                </div>
            </form>
        </div>
    </div>

    <div id="delete-confirm-modal" class="modal-overlay" style="display:none; z-index: 2100; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);">
        <div class="modal-content" style="max-width: 380px; text-align: center; padding: 30px; border-radius: 15px;">
            <div style="color: #ef4444; font-size: 3.5rem; margin-bottom: 15px;">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 style="margin-bottom: 10px; font-size: 1.3rem;">¿Eliminar usuario?</h3>
            <p style="color: #64748b; font-size: 0.95rem; margin-bottom: 25px;">
                Esta acción borrará el acceso de <strong id="delete-user-name" style="color: #1e293b;">...</strong> permanentemente. No podrás deshacerlo.
            </p>
            <div style="display: flex; gap: 12px;">
                <button id="cancel-delete-btn" class="btn-secondary" style="flex: 1;">No, volver</button>
                <button id="confirm-delete-btn" class="btn-delete-final" style="flex: 1; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="assets/js/admin-settings.js"></script>
    <script type="module">
        import { injectSidebar } from './assets/js/sidebar.js';
        injectSidebar(); 
    </script>
</body>
</html>
