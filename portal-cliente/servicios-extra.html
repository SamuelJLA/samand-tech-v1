<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Extra | SAMANDTECH</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-page">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h3>SAMANDTECH</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard-cliente.html"><i class="fa-solid fa-ticket"></i> Mis Tickets</a>
                <a href="reportes-cliente.html"><i class="fa-solid fa-chart-line"></i> Mis Reportes</a>
                <a href="solicitud-componentes.html" class="multiline-item"><i class="fa-solid fa-cart-plus"></i> Solicitud de Componentes</a>
                <a href="servicios-extra.html" class="active"><i class="fa-solid fa-wand-magic-sparkles"></i> Servicio Extra</a>
                <a href="configuracion-cliente.html"><i class="fa-solid fa-gear"></i> Configuración</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn-logout-sidebar">Cerrar Sesión</button>
            </div>
        </aside> 

    <main class="main-content">
        <header class="top-bar">
            <div class="page-info"><h2 id="company-name">Servicios Adicionales</h2></div>
            <div class="user-info">
                <span id="user-display-name">...</span> 
                <div class="avatar" id="user-initials">--</div> 
            </div>
        </header>

        <section class="content-area">
            <div class="header-section">
                <div>
                    <h3 id="service-title"><i class="fa-solid fa-wand-magic-sparkles"></i> ¿En qué podemos ayudarte?</h3>
                    <p id="service-subtitle" style="color: #64748b;">Selecciona una línea de servicio especializado.</p>
                </div>
                <button id="btn-back-services" class="btn-secondary-sm" style="display: none;">
                    <i class="fa-solid fa-arrow-left"></i> Volver
                </button>
            </div>

            <div id="services-grid" class="components-grid-container">
                </div>
        </section>

        <div id="service-modal" class="modal-overlay">
            <div class="modal-content modal-animated" style="max-width: 500px;">
                <div class="modal-header">
                    <h3>Solicitar Servicio</h3>
                    <button class="btn-close" id="close-service-modal">&times;</button>
                </div>
                <form id="service-request-form">
                    <p>Servicio seleccionado: <strong id="selected-service-name">---</strong></p>
                    <div class="form-group">
                        <label>Descripción del requerimiento</label>
                        <textarea id="service-notes" rows="4" placeholder="Cuéntanos más sobre lo que necesitas..." required></textarea>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn-secondary" id="cancel-service">Cancelar</button>
                        <button type="submit" class="btn-primary">Enviar Solicitud</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../assets/js/client/client-services.js"></script>
</body>
</html>
